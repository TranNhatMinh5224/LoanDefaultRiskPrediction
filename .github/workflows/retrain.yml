name: 🔄 Auto Retraining Pipeline

on:
  schedule:
    # Run at 2:00 AM on the 1st of every 3 months (Jan, Apr, Jul, Oct)
    - cron: '0 2 1 */3 *'
  workflow_dispatch:
    # Allow manual triggering via GitHub Actions UI

permissions:
  contents: write

jobs:
  retrain:
    name: 🤖 Run ML Retraining
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install gdown pytest
          # Set python path to find modules in src/
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

      - name: Lấy dữ liệu mới nhất từ Google Drive (Public Link)
        run: |
          # Download raw datasets folder into Data/
          gdown --folder https://drive.google.com/drive/folders/1_DUfhumPl-nxJUR2oJMxFwpDBNbuwYMl -O Data/
          # Flatten any subdirectory structure created by gdown
          mv Data/*/* Data/ 2>/dev/null || true

      - name: Run Preprocessing Pipeline
        run: |
          python src/preprocess.py

      - name: Run Feature Engineering
        run: |
          python src/feature_engineering.py

      - name: Run Model Training
        run: |
          python src/train.py

      - name: Run Evaluation and Registry Promotion
        run: |
          python src/evaluate.py

      - name: Run Backend Tests
        run: |
          # Verify that serving layer still loads and runs successfully with the promoted model
          pytest src/backend/tests/ -v --tb=short

      - name: Commit & Push Promoted Model & Metadata
        run: |
          git config --global user.name "MLOps Bot"
          git config --global user.email "mlops-bot@example.com"
          
          # Add promoted model files, metadata, and retrained test submissions from the registry
          git add -f Model/lgbm_model_v1.joblib
          git add -f Model/preprocessor_v1.joblib
          git add -f Model/model_metadata.json
          git add -f Model/submission_retrained.csv
                  
          # Only commit and push if there are staged changes
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-retrained & promoted model to production"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
